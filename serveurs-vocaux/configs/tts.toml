# Configuration du serveur de synthèse vocale Kyutai TTS 1.6B (anglais + français).
# Reprise de github.com/kyutai-labs/unmute (licence MIT), batch_size=1 pour tenir dans 8 Go.

static_dir = "./static/"
log_dir = "/tmp/raphael_logs"
instance_name = "tts"
authorized_ids = ["public_token"]

[modules.tts_py]
type = "Py"
path = "/api/tts_streaming"
text_tokenizer_file = "hf://kyutai/tts-1.6b-en_fr/tokenizer_spm_8k_en_fr_audio.model"
# A higher batch size allows you to serve more users at once, but with a higher latency and memory usage.
batch_size = 1
text_bos_token = 1

[modules.tts_py.py]
log_folder = "/tmp/raphael_logs"
# We could use replace **/*.safetensors with unmute-prod-website/*.safetensors
# to only get the voices used in Unmute, but we are using the TTS for the demo
# on the project page too and for that we want to load the other voices as well
# Seulement les voix du site Unmute (dont les 2 voix françaises), pour éviter de
# télécharger les 900 fichiers du dépôt (Hugging Face limite les téléchargements anonymes).
voice_folder = "hf-snapshot://kyutai/tts-voices/unmute-prod-website/*.safetensors"
default_voice = "unmute-prod-website/default_voice.wav"
cfg_coef = 2.0
cfg_is_no_text = true
padding_between = 1
n_q = 24
