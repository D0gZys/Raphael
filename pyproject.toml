[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raphael"
version = "0.1.0"
description = "Raphaël, un assistant vocal type Jarvis : conversation naturelle en français + recherche internet."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",        # client compatible avec Groq, Mistral, Gemini, Ollama...
    "tavily-python>=0.7",  # recherche web
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Dépendances du mode vocal (micro, haut-parleur, serveurs Kyutai)
voix = [
    "websockets>=13",
    "msgpack>=1.0",
    "numpy>=1.26",
    "sounddevice>=0.4",
]
dev = ["pytest>=8"]

[project.scripts]
raphael = "raphael.__main__:main"

[tool.setuptools.packages.find]
include = ["raphael*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
